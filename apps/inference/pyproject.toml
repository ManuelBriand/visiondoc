[project]
name = "inference"
version = "0.1.0"
description = "Extraction des données des pièces d'identité françaises (V0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.159.1",
    "numpy>=2.5.4",
    # Version et nom de paquet imposés par paddlex, qui vérifie sa présence par son nom.
    "opencv-contrib-python==4.10.0.84",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Hasard non cryptographique voulu : spécimens reproductibles par graine.
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paddleocr", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: charge le vrai modèle d'OCR (extra `ocr`), lancé avec `pytest -m slow`"]

[tool.coverage.run]
source = ["inference"]
branch = true
