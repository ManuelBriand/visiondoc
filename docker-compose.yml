services:
  inference:
    build: ./apps/inference
    platform: linux/amd64
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    # Système de fichiers en lecture seule : aucune image ne peut être écrite sur disque.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    restart: unless-stopped
